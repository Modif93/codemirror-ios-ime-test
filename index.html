<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>CodeMirror iOS Korean IME Test v5</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 16px; line-height: 1.45; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    .card { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button, input { font: inherit; min-height: 40px; padding: 8px 10px; }
    button { cursor: pointer; }
    .muted { opacity: .72; font-size: 13px; }
    .warn { color: #c15b00; }
    .danger { color: #b00020; }
    #editor { border: 1px solid color-mix(in srgb, currentColor 35%, transparent); border-radius: 10px; min-height: 180px; font-size: 24px; overflow: hidden; }
    .cm-editor, .cm-content { min-height: 180px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 380px; overflow: auto; border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 10px; padding: 10px; margin: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pill { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 999px; padding: 3px 8px; font-size: 12px; }
    .spacer { height: 4px; }
  </style>
</head>
<body>
  <h1>CodeMirror iOS Korean IME Test v5</h1>
  <div class="muted">Exact Bare vs Standard Bundled · logger off / buffer-only / deferred-live</div>

  <div class="card">
    <div class="row">
      <label for="config">Configuration</label>
      <select id="config">
        <option value="bare" selected>Exact Bare (@codemirror/view only)</option>
        <option value="standard">Standard Bundled (codemirror + basicSetup)</option>
      </select>

      <label for="version">View version</label>
      <select id="version">
        <option>6.42.1</option>
        <option>6.43.1</option>
        <option>6.43.4</option>
        <option>6.43.5</option>
        <option>6.43.9</option>
        <option>6.43.10</option>
        <option selected>6.43.11</option>
      </select>

      <label for="loggerMode">Logger</label>
      <select id="loggerMode">
        <option value="off">Off</option>
        <option value="buffer" selected>Buffer only</option>
        <option value="deferred">Deferred live</option>
      </select>

      <button id="loadEditor">Load editor</button>
    </div>

    <div class="spacer"></div>
    <div id="modeHelp" class="muted"></div>
    <div id="loadedMeta" class="muted">Not loaded</div>
  </div>

  <div class="card">
    <div><strong>Recommended sequence</strong></div>
    <div class="muted">
      1) Standard + Logger Off → 2) Bare + Logger Off → 3) Standard + Buffer only → 4) Bare + Buffer only
    </div>
  </div>

  <h2>Editor</h2>
  <div id="editor"></div>

  <div class="row" style="margin:10px 0 20px">
    <button id="clearEditor">Clear editor</button>
    <span id="eventCount" class="pill">Buffered events: 0</span>
  </div>

  <h2>Input event log</h2>
  <div class="row" style="margin-bottom:8px">
    <button id="renderLog">Render Log</button>
    <button id="copyLog">Copy Log</button>
    <button id="clearLog">Clear Log</button>
  </div>
  <pre id="log"></pre>

<script type="module">
const qs = new URLSearchParams(location.search);

const configEl = document.querySelector("#config");
const versionEl = document.querySelector("#version");
const loggerModeEl = document.querySelector("#loggerMode");
const editorHost = document.querySelector("#editor");
const loadedMeta = document.querySelector("#loadedMeta");
const modeHelp = document.querySelector("#modeHelp");
const eventCount = document.querySelector("#eventCount");
const logEl = document.querySelector("#log");

if (qs.get("config")) configEl.value = qs.get("config");
if (qs.get("v") && [...versionEl.options].some(o => o.value === qs.get("v"))) versionEl.value = qs.get("v");
if (qs.get("logger")) loggerModeEl.value = qs.get("logger");

let currentView = null;
let contentDOM = null;
let buffer = [];
let t0 = performance.now();
let deferredTimer = null;
let cleanupFns = [];

function updateModeUi() {
  const standard = configEl.value === "standard";
  versionEl.disabled = standard;
  modeHelp.textContent = standard
    ? "Standard Bundled mode uses a single codemirror bundle. The exact @codemirror/view version is not controlled by this selector."
    : "Exact Bare mode imports only the selected @codemirror/view package. No separate @codemirror/state package is imported.";
}
configEl.addEventListener("change", updateModeUi);
updateModeUi();

function stable(v) {
  return v === undefined ? null : v;
}

function nodeDesc(node) {
  if (!node) return null;
  if (node.nodeType === Node.TEXT_NODE) {
    const p = node.parentElement;
    return `#text${p ? ` <${p.tagName.toLowerCase()}.${String(p.className || "").replace(/\s+/g, ".")}>` : ""}`;
  }
  if (!(node instanceof Element)) return node.nodeName || String(node);
  const id = node.id ? `#${node.id}` : "";
  const cls = node.className && typeof node.className === "string"
    ? "." + node.className.trim().replace(/\s+/g, ".")
    : "";
  return `${node.tagName.toLowerCase()}${id}${cls}`;
}

function getDomSelectionInfo() {
  const sel = document.getSelection();
  if (!sel) return null;
  return {
    anchorNode: nodeDesc(sel.anchorNode),
    anchorOffset: sel.anchorOffset,
    focusNode: nodeDesc(sel.focusNode),
    focusOffset: sel.focusOffset,
    isCollapsed: sel.isCollapsed
  };
}

function getEditorSelectionInfo() {
  if (!currentView) return null;
  const main = currentView.state.selection.main;
  return { from: main.from, to: main.to };
}

function getDoc() {
  return currentView ? currentView.state.doc.toString() : "";
}

function rangeInfo(e) {
  if (!e.getTargetRanges) return [];
  try {
    return [...e.getTargetRanges()].map(r => ({
      startOffset: r.startOffset,
      endOffset: r.endOffset,
      collapsed: r.collapsed,
      startNode: r.startContainer?.nodeName ?? null,
      endNode: r.endContainer?.nodeName ?? null
    }));
  } catch {
    return [];
  }
}

function makeEventRecord(e, label) {
  const isKeyboard = e instanceof KeyboardEvent;
  return {
    t: Number((performance.now() - t0).toFixed(1)),
    label,
    eventTimeStamp: Number.isFinite(e.timeStamp) ? Number(e.timeStamp.toFixed(3)) : stable(e.timeStamp),
    type: e.type,
    key: isKeyboard ? stable(e.key) : null,
    code: isKeyboard ? stable(e.code) : null,
    keyCode: isKeyboard ? stable(e.keyCode) : null,
    charCode: isKeyboard ? stable(e.charCode) : null,
    which: isKeyboard ? stable(e.which) : null,
    repeat: isKeyboard ? stable(e.repeat) : null,
    location: isKeyboard ? stable(e.location) : null,
    altKey: isKeyboard ? !!e.altKey : null,
    ctrlKey: isKeyboard ? !!e.ctrlKey : null,
    metaKey: isKeyboard ? !!e.metaKey : null,
    shiftKey: isKeyboard ? !!e.shiftKey : null,
    inputType: "inputType" in e ? stable(e.inputType) : null,
    data: "data" in e ? stable(e.data) : null,
    isComposing: "isComposing" in e ? stable(e.isComposing) : null,
    defaultPrevented: e.defaultPrevented,
    cancelable: e.cancelable,
    targetRanges: rangeInfo(e),
    target: nodeDesc(e.target),
    doc: getDoc(),
    editorSelection: getEditorSelectionInfo(),
    domSelection: getDomSelectionInfo()
  };
}

function scheduleDeferredRender() {
  if (loggerModeEl.value !== "deferred") return;
  clearTimeout(deferredTimer);
  deferredTimer = setTimeout(() => {
    renderLog();
  }, 800);
}

function recordEvent(e, label) {
  // Critical: no DOM writes, no stringify, no scroll, no layout reads here.
  buffer.push(makeEventRecord(e, label));
  // eventCount is intentionally NOT updated here to avoid DOM writes in the input path.
  scheduleDeferredRender();
}

function renderLog() {
  eventCount.textContent = `Buffered events: ${buffer.length}`;
  logEl.textContent = buffer.map(x => `${String(x.t).padStart(8)}  ${x.label} ${JSON.stringify(x)}`).join("\n");
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() {
  buffer = [];
  logEl.textContent = "";
  eventCount.textContent = "Buffered events: 0";
}

function removeListeners() {
  for (const fn of cleanupFns) {
    try { fn(); } catch {}
  }
  cleanupFns = [];
}

function addListener(target, type, fn, options) {
  target.addEventListener(type, fn, options);
  cleanupFns.push(() => target.removeEventListener(type, fn, options));
}

function installLogger() {
  if (loggerModeEl.value === "off" || !contentDOM) return;

  const inputTypes = [
    "keydown",
    "keypress",
    "keyup",
    "beforeinput",
    "input",
    "compositionstart",
    "compositionupdate",
    "compositionend"
  ];

  for (const type of inputTypes) {
    const docFn = e => {
      const path = e.composedPath?.() ?? [];
      if (!path.includes(contentDOM) && !contentDOM.contains(e.target)) return;
      recordEvent(e, `${type}:document-capture`);
    };
    const editorFn = e => recordEvent(e, `${type}:editor-capture`);

    addListener(document, type, docFn, true);
    addListener(contentDOM, type, editorFn, true);
  }

  const selectionFn = () => {
    const sel = document.getSelection();
    if (!sel) return;
    const anchor = sel.anchorNode?.nodeType === Node.TEXT_NODE ? sel.anchorNode.parentElement : sel.anchorNode;
    const focus = sel.focusNode?.nodeType === Node.TEXT_NODE ? sel.focusNode.parentElement : sel.focusNode;
    const inEditor =
      (anchor instanceof Node && contentDOM.contains(anchor)) ||
      (focus instanceof Node && contentDOM.contains(focus));

    if (!inEditor) return;

    buffer.push({
      t: Number((performance.now() - t0).toFixed(1)),
      label: "selectionchange",
      type: "selectionchange",
      doc: getDoc(),
      editorSelection: getEditorSelectionInfo(),
      domSelection: getDomSelectionInfo()
    });
    scheduleDeferredRender();
  };
  addListener(document, "selectionchange", selectionFn, true);
}

async function loadBare(version) {
  const url = `https://cdn.jsdelivr.net/npm/@codemirror/view@${version}/+esm`;
  const mod = await import(url);
  const { EditorView } = mod;

  currentView = new EditorView({
    doc: "",
    parent: editorHost
  });

  return {
    mode: "Exact Bare",
    source: url,
    requestedViewVersion: version,
    notes: "Only @codemirror/view is imported directly. No separately imported @codemirror/state."
  };
}

async function loadStandard() {
  // Single entry point. The module graph is bundled together to avoid duplicate @codemirror/state instances.
  const url = "https://esm.sh/codemirror@6.0.2?bundle";
  const mod = await import(url);
  const { EditorView, basicSetup } = mod;

  currentView = new EditorView({
    doc: "",
    extensions: [basicSetup],
    parent: editorHost
  });

  return {
    mode: "Standard Bundled",
    source: url,
    requestedViewVersion: null,
    notes: "Single bundled codemirror entry point with basicSetup. Exact internal @codemirror/view version is determined by this bundle."
  };
}

async function loadEditor() {
  loadedMeta.textContent = "Loading…";
  loadedMeta.className = "muted";

  removeListeners();
  clearTimeout(deferredTimer);
  deferredTimer = null;
  clearLog();

  if (currentView) {
    try { currentView.destroy(); } catch {}
    currentView = null;
  }
  editorHost.replaceChildren();
  contentDOM = null;
  t0 = performance.now();

  try {
    const config = configEl.value;
    const version = versionEl.value;
    const meta = config === "bare"
      ? await loadBare(version)
      : await loadStandard();

    contentDOM = currentView.contentDOM;
    installLogger();
    currentView.focus();

    const loggerMode = loggerModeEl.value;
    const metadata = {
      ...meta,
      loggerMode,
      contentDOM: nodeDesc(contentDOM)
    };

    loadedMeta.textContent = JSON.stringify(metadata, null, 2);

    // Keep URL shareable.
    const url = new URL(location.href);
    url.searchParams.set("config", config);
    url.searchParams.set("logger", loggerMode);
    if (config === "bare") url.searchParams.set("v", version);
    else url.searchParams.delete("v");
    history.replaceState(null, "", url);
  } catch (err) {
    loadedMeta.className = "muted danger";
    loadedMeta.textContent = `Load failed: ${err?.stack || err}`;
    throw err;
  }
}

document.querySelector("#loadEditor").addEventListener("click", loadEditor);

document.querySelector("#clearEditor").addEventListener("click", () => {
  if (!currentView) return;
  currentView.dispatch({
    changes: { from: 0, to: currentView.state.doc.length, insert: "" }
  });
  currentView.focus();
});

document.querySelector("#renderLog").addEventListener("click", renderLog);

document.querySelector("#copyLog").addEventListener("click", async () => {
  const text = buffer.map(x => `${String(x.t).padStart(8)}  ${x.label} ${JSON.stringify(x)}`).join("\n");
  await navigator.clipboard.writeText(text);
});

document.querySelector("#clearLog").addEventListener("click", clearLog);

window.addEventListener("error", e => {
  loadedMeta.className = "muted danger";
  loadedMeta.textContent = `JavaScript error: ${e.message || "unknown error"}`;
});

window.addEventListener("unhandledrejection", e => {
  loadedMeta.className = "muted danger";
  loadedMeta.textContent = `Unhandled rejection: ${String(e.reason || "unknown error")}`;
});

// Initial load.
await loadEditor();
</script>
</body>
</html>
