<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>CodeMirror iOS Korean IME Test - Enhanced CM5 Logger</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 16px;
      line-height: 1.45;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    .card {
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button, input {
      font: inherit;
      min-height: 40px;
      padding: 8px 10px;
    }
    button { cursor: pointer; }
    .metric {
      flex: 1 1 120px;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 10px;
      padding: 10px;
    }
    .metric strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
    }
    .test-string {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .02em;
      user-select: all;
    }
    #editor {
      border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      border-radius: 10px;
      min-height: 180px;
      font-size: 24px;
      overflow: hidden;
    }
    .cm-editor { min-height: 180px; }
    .cm-content { min-height: 180px; }
    .CodeMirror {
      min-height: 180px;
      height: auto;
      font-size: 24px;
      border-radius: 10px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      max-height: 320px;
      overflow: auto;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 10px;
      padding: 10px;
      margin: 0;
    }
    .muted { opacity: .7; font-size: 13px; }
    .danger { color: #b00020; }
  </style>
</head>
<body>
  <h1>CodeMirror iOS Korean IME Test</h1>
  <div class="muted">Enhanced CM5 logger: document capture + composedPath + CM5 change hooks</div>

  <div class="card">
    <div class="row">
      <label for="version">CodeMirror View</label>
      <select id="version">
        <optgroup label="CodeMirror 5">
          <option>5.65.4</option>
          <option>5.65.10</option>
          <option>5.65.16</option>
        </optgroup>
        <optgroup label="CodeMirror 6">
          <option>6.42.1</option>
          <option>6.43.1</option>
          <option>6.43.4</option>
          <option>6.43.9</option>
          <option>6.43.10</option>
          <option selected>6.43.11</option>
        </optgroup>
      </select>
      <button id="loadVersion">Load version</button>
    </div>
    <div class="muted" id="loadedVersion">Loading…</div>
  </div>

  <div class="card">
    <div>Test sequence</div>
    <div class="test-string">백두산이</div>
    <div class="muted">Danmoum keys: ㅂ → ㅐ → ㄱ → ㄷ → ㅜ → ㅅ → ㅏ → ㄴ → ㅇ → ㅣ</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="metric">Attempts<strong id="attempts">0</strong></div>
      <div class="metric">Failures<strong id="failures">0</strong></div>
      <div class="metric">Rate<strong id="rate">0%</strong></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="addAttempt">+ Attempt</button>
      <button id="addFailure">+ Failure</button>
      <button id="undo">Undo count</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <h2>Editor</h2>
  <div id="editor"></div>

  <div class="row" style="margin:10px 0 20px">
    <button id="clearEditor">Clear editor</button>
    <button id="copySummary">Copy summary</button>
  </div>

  <h2>Input event log</h2>
  <div class="row" style="margin-bottom:8px">
    <button id="clearLog">Clear log</button>
    <button id="copyLog">Copy log</button>
  </div>
  <pre id="log"></pre>

  <script type="module">
    const qs = new URLSearchParams(location.search);
    const versionSelect = document.querySelector("#version");
    const requestedVersion = qs.get("v") || "6.43.11";
    if ([...versionSelect.options].some(o => o.value === requestedVersion)) {
      versionSelect.value = requestedVersion;
    }

    document.querySelector("#loadVersion").onclick = () => {
      const v = versionSelect.value;
      const url = new URL(location.href);
      url.searchParams.set("v", v);
      location.href = url.toString();
    };

    let attempts = Number(localStorage.getItem("cm-ime-attempts") || 0);
    let failures = Number(localStorage.getItem("cm-ime-failures") || 0);
    const history = [];

    function renderCounts() {
      document.querySelector("#attempts").textContent = attempts;
      document.querySelector("#failures").textContent = failures;
      document.querySelector("#rate").textContent =
        attempts ? `${((failures / attempts) * 100).toFixed(1)}%` : "0%";
      localStorage.setItem("cm-ime-attempts", attempts);
      localStorage.setItem("cm-ime-failures", failures);
    }

    document.querySelector("#addAttempt").onclick = () => {
      history.push([attempts, failures]);
      attempts++;
      renderCounts();
    };
    document.querySelector("#addFailure").onclick = () => {
      history.push([attempts, failures]);
      attempts++;
      failures++;
      renderCounts();
    };
    document.querySelector("#undo").onclick = () => {
      const prev = history.pop();
      if (!prev) return;
      [attempts, failures] = prev;
      renderCounts();
    };
    document.querySelector("#reset").onclick = () => {
      history.push([attempts, failures]);
      attempts = 0;
      failures = 0;
      renderCounts();
    };
    renderCounts();

    const log = document.querySelector("#log");
    const t0 = performance.now();
    function appendLog(type, data = {}) {
      const ms = (performance.now() - t0).toFixed(1).padStart(8);
      log.textContent += `${ms}  ${type} ${JSON.stringify(data)}\n`;
      log.scrollTop = log.scrollHeight;
    }

    const viewVersion = versionSelect.value;
    const isCM5 = viewVersion.startsWith("5.");

    document.querySelector("#loadedVersion").textContent =
      `Loading CodeMirror ${viewVersion}…`;

    window.addEventListener("error", (e) => {
      document.querySelector("#loadedVersion").innerHTML =
        `<span class="danger">JavaScript error: ${e.message || "unknown error"}</span>`;
    });

    window.addEventListener("unhandledrejection", (e) => {
      document.querySelector("#loadedVersion").innerHTML =
        `<span class="danger">Module load error: ${String(e.reason || "unknown error")}</span>`;
    });

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(s);
      });
    }

    function loadCss(href) {
      return new Promise((resolve, reject) => {
        const l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = href;
        l.onload = resolve;
        l.onerror = () => reject(new Error(`Failed to load ${href}`));
        document.head.appendChild(l);
      });
    }

    try {
      let getDocText;
      let clearEditorImpl;
      let focusEditorImpl;
      let contentDOM;
      let getSelectionInfo;
      let moduleDescription;

      let cm5Instance = null;
      let cm5Wrapper = null;

      if (isCM5) {
        const base = `https://cdn.jsdelivr.net/npm/codemirror@${viewVersion}`;
        await Promise.all([
          loadCss(`${base}/lib/codemirror.css`),
          loadScript(`${base}/lib/codemirror.js`)
        ]);

        const textarea = document.createElement("textarea");
        textarea.id = "cm5-source";
        document.querySelector("#editor").appendChild(textarea);

        const cm = window.CodeMirror.fromTextArea(textarea, {
          lineNumbers: false,
          lineWrapping: true,
          inputStyle: "contenteditable"
        });

        cm5Instance = cm;
        cm5Wrapper = cm.getWrapperElement();

        // Keep a local target for CM5, but actual event logging is also
        // installed at document capture phase below so hidden/internal
        // input targets cannot escape the logger.
        contentDOM =
          cm5Wrapper.querySelector(".CodeMirror-code") ||
          cm5Wrapper.querySelector("[contenteditable=true]") ||
          cm5Wrapper;

        getDocText = () => cm.getValue();
        getSelectionInfo = () => {
          const from = cm.getCursor("from");
          const to = cm.getCursor("to");
          return {from, to};
        };
        clearEditorImpl = () => {
          cm.setValue("");
          cm.focus();
        };
        focusEditorImpl = () => cm.focus();
        moduleDescription = `jsDelivr CodeMirror ${viewVersion}`;
      } else {
        const viewUrl = `https://cdn.jsdelivr.net/npm/@codemirror/view@${viewVersion}/+esm`;
        const {EditorView} = await import(viewUrl);

        const view = new EditorView({
          doc: "",
          parent: document.querySelector("#editor")
        });

        contentDOM = view.contentDOM;
        getDocText = () => view.state.doc.toString();
        getSelectionInfo = () => ({
          from: view.state.selection.main.from,
          to: view.state.selection.main.to
        });
        clearEditorImpl = () => {
          view.dispatch({
            changes: {from: 0, to: view.state.doc.length, insert: ""}
          });
          view.focus();
        };
        focusEditorImpl = () => view.focus();
        moduleDescription = `jsDelivr ESM: ${viewUrl}`;
      }

      document.querySelector("#loadedVersion").textContent =
        `Loaded CodeMirror ${viewVersion}`;

      function rangeInfo(e) {
        if (!e.getTargetRanges) return [];
        try {
          return [...e.getTargetRanges()].map(r => ({
            startOffset: r.startOffset,
            endOffset: r.endOffset,
            collapsed: r.collapsed,
            startNode: r.startContainer?.nodeName,
            endNode: r.endContainer?.nodeName,
            startClass: r.startContainer?.parentElement?.className || null,
            endClass: r.endContainer?.parentElement?.className || null
          }));
        } catch {
          return [];
        }
      }

      function nodeDesc(node) {
        if (!node) return null;
        if (node.nodeType === Node.TEXT_NODE) {
          const p = node.parentElement;
          return `#text${p ? ` <${p.tagName.toLowerCase()}.${String(p.className || "").replace(/\s+/g, ".")}>` : ""}`;
        }
        if (!(node instanceof Element)) return node.nodeName || String(node);
        const id = node.id ? `#${node.id}` : "";
        const cls = node.className && typeof node.className === "string"
          ? "." + node.className.trim().replace(/\s+/g, ".")
          : "";
        return `${node.tagName.toLowerCase()}${id}${cls}`;
      }

      function eventPathInfo(e) {
        try {
          return e.composedPath()
            .slice(0, 12)
            .map(nodeDesc)
            .filter(Boolean);
        } catch {
          return [];
        }
      }

      function domSelectionInfo() {
        const sel = document.getSelection();
        if (!sel) return null;
        return {
          anchorNode: nodeDesc(sel.anchorNode),
          anchorOffset: sel.anchorOffset,
          focusNode: nodeDesc(sel.focusNode),
          focusOffset: sel.focusOffset,
          isCollapsed: sel.isCollapsed
        };
      }

      function belongsToEditor(e) {
        const path = e.composedPath ? e.composedPath() : [];
        if (isCM5) {
          return path.includes(cm5Wrapper) ||
                 path.some(n => n instanceof Element &&
                   (n === cm5Wrapper || cm5Wrapper?.contains(n)));
        }
        return path.includes(contentDOM) ||
               path.some(n => n instanceof Element &&
                 (n === contentDOM || contentDOM?.contains(n)));
      }

      function logInputEvent(e, phase = "capture") {
        if (!belongsToEditor(e)) return;

        appendLog(`${e.type}:${phase}`, {
          target: nodeDesc(e.target),
          currentTarget: nodeDesc(e.currentTarget),
          inputType: "inputType" in e ? e.inputType : undefined,
          data: "data" in e ? e.data : undefined,
          isComposing: "isComposing" in e ? e.isComposing : undefined,
          defaultPrevented: e.defaultPrevented,
          cancelable: e.cancelable,
          targetRanges: rangeInfo(e),
          path: eventPathInfo(e),
          doc: getDocText(),
          editorSelection: getSelectionInfo(),
          domSelection: domSelectionInfo()
        });
      }

      // Most important CM5 improvement:
      // capture input-related events at document level so CodeMirror 5's
      // internal input node / hidden textarea / contenteditable path is visible.
      const inputEventTypes = [
        "beforeinput",
        "input",
        "compositionstart",
        "compositionupdate",
        "compositionend",
        "keydown",
        "keyup"
      ];

      for (const type of inputEventTypes) {
        document.addEventListener(type, e => logInputEvent(e, "document-capture"), true);
      }

      // Also keep an editor-local capture listener. This helps compare whether
      // an event reached the visible editing DOM in CM5/CM6.
      for (const type of inputEventTypes) {
        contentDOM.addEventListener(type, e => logInputEvent(e, "editor-capture"), true);
      }

      // CM5-specific state hooks. These do not replace DOM event logging, but
      // help correlate CodeMirror's internal document/selection updates.
      if (isCM5 && cm5Instance) {
        cm5Instance.on("beforeChange", (instance, change) => {
          appendLog("cm5:beforeChange", {
            from: change.from,
            to: change.to,
            text: change.text,
            origin: change.origin,
            doc: instance.getValue(),
            selection: getSelectionInfo(),
            domSelection: domSelectionInfo()
          });
        });

        cm5Instance.on("change", (instance, change) => {
          appendLog("cm5:change", {
            from: change.from,
            to: change.to,
            text: change.text,
            removed: change.removed,
            origin: change.origin,
            doc: instance.getValue(),
            selection: getSelectionInfo(),
            domSelection: domSelectionInfo()
          });
        });

        cm5Instance.on("cursorActivity", instance => {
          appendLog("cm5:cursorActivity", {
            doc: instance.getValue(),
            selection: getSelectionInfo(),
            domSelection: domSelectionInfo()
          });
        });
      }

      document.addEventListener("selectionchange", () => {
        const sel = document.getSelection();
        if (!sel) return;

        // Avoid logging unrelated selection changes outside the editor.
        const anchorEl = sel.anchorNode?.nodeType === Node.TEXT_NODE
          ? sel.anchorNode.parentElement
          : sel.anchorNode;
        const focusEl = sel.focusNode?.nodeType === Node.TEXT_NODE
          ? sel.focusNode.parentElement
          : sel.focusNode;

        const inEditor = isCM5
          ? ((anchorEl instanceof Node && cm5Wrapper?.contains(anchorEl)) ||
             (focusEl instanceof Node && cm5Wrapper?.contains(focusEl)))
          : ((anchorEl instanceof Node && contentDOM?.contains(anchorEl)) ||
             (focusEl instanceof Node && contentDOM?.contains(focusEl)));

        if (!inEditor) return;

        appendLog("selectionchange", {
          ...domSelectionInfo(),
          doc: getDocText(),
          editorSelection: getSelectionInfo()
        });
      });

      document.querySelector("#clearEditor").onclick = () => {
        clearEditorImpl();
      };

      document.querySelector("#copySummary").onclick = async () => {
        const text =
`CodeMirror iOS Korean IME test
CodeMirror: ${viewVersion}
Attempts: ${attempts}
Failures: ${failures}
Rate: ${attempts ? ((failures/attempts)*100).toFixed(1) : 0}%
Test: 백두산이
Keyboard layout: Danmoum`;
        await navigator.clipboard.writeText(text);
      };

      document.querySelector("#copyLog").onclick = async () => {
        await navigator.clipboard.writeText(log.textContent);
      };
      document.querySelector("#clearLog").onclick = () => {
        log.textContent = "";
      };

      appendLog("ready", {
        version: viewVersion,
        generation: isCM5 ? 5 : 6,
        source: moduleDescription
      });

      focusEditorImpl();
    } catch (err) {
      const attempted = isCM5
        ? `https://cdn.jsdelivr.net/npm/codemirror@${viewVersion}`
        : `https://cdn.jsdelivr.net/npm/@codemirror/view@${viewVersion}/+esm`;
      document.querySelector("#loadedVersion").innerHTML =
        `<span class="danger">Failed to load ${viewVersion}: ${String(err)}<br>URL: ${attempted}</span>`;
      appendLog("load-error", {message: String(err), attempted});
    }
  </script>
</body>
</html>
